[pytest]
DJANGO_SETTINGS_MODULE = agency_backend.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --cov=canvas --cov-report=html --cov-report=term-missing
testpaths = backend
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, test component interactions)
    functional: Functional tests (slowest, end-to-end browser tests)
    slow: Slow tests (skip in CI if needed)
